# OpenTDF platform v0.27.0: running and trusting the IdP; nothing encrypts yet.
# Environment variables only override keys present in this file: the issuer,
# audience, allowed origin and database password below are placeholders that
# docker-compose.yml overrides.

logger:
  level: info
  type: json
  output: stdout

db:
  host: postgres
  port: 5432
  database: opentdf
  user: opentdf
  password: placeholder
  sslmode: disable
  schema: opentdf
  runMigrations: true

mode: all

services:
  entityresolution:
    # The default "keycloak" mode would query a Keycloak admin API.
    mode: claims
  kas:
    keyring:
      - kid: r1
        alg: rsa:2048
      - kid: e1
        alg: ec:secp256r1

server:
  port: 8080
  auth:
    enabled: true
    issuer: https://placeholder.invalid/
    audience: placeholder
    dpop:
      enforce: false
    cache_refresh_interval: 15m
    skew: 1m
    policy:
      username_claim: preferred_username
      groups_claim: groups
      # LemonLDAP::NG access tokens carry client_id, not azp.
      client_id_claim: client_id
      # Setting extension drops the built-in opentdf-admin/opentdf-standard roles.
      extension: |
        g, dcs-maquette-admin, role:admin
        g, dcs-maquette, role:standard
  cors:
    enabled: true
    allowedorigins:
      - https://placeholder.invalid
    additionalheaders:
      - Connect-Timeout-Ms
      - X-User-Agent
  grpc:
    reflectionEnabled: false
  cryptoProvider:
    type: standard
    standard:
      keys:
        - kid: r1
          alg: rsa:2048
          private: /etc/opentdf/keys/kas-private.pem
          cert: /etc/opentdf/keys/kas-cert.pem
        - kid: e1
          alg: ec:secp256r1
          private: /etc/opentdf/keys/kas-ec-private.pem
          cert: /etc/opentdf/keys/kas-ec-cert.pem
