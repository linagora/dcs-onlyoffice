# OpenTDF platform v0.27.0: trusts the IdP and resolves each person's
# clearances from the clearance directory.
# Environment variables only override keys present in this file: the issuer,
# audience, allowed origin, database passwords, KAS root key and KAS address
# below are placeholders that docker-compose.yml overrides.

logger:
  level: info
  type: json
  output: stdout

db:
  host: postgres
  port: 5432
  database: opentdf
  user: dcs_opentdf
  password: placeholder
  sslmode: disable
  schema: opentdf
  runMigrations: true

mode: all

services:
  entityresolution:
    # Each person's clearances come from the clearance directory, looked up by
    # the email of the access token (ADR 0002). A preview in OpenTDF 0.27.
    mode: multi-strategy
    failure_strategy: fail-fast
    providers:
      directory:
        type: sql
        connection:
          driver: postgres
          host: postgres
          port: 5432
          database: opentdf
          username: dcs_directory_reader
          password: placeholder
          ssl_mode: disable
    mapping_strategies:
      - name: clearance_directory
        provider: directory
        entity_type: subject
        conditions:
          jwt_claims:
            - claim: email
              operator: exists
        # Always one row: a person without a clearance valid now gets empty
        # lists, hence no access. Lists are joined with commas, since the
        # driver's array format is not portable: the policy service's
        # directory module describes the format and refuses names that would
        # break it.
        query: |
          WITH valid AS (
            SELECT policy, classification, categories
            FROM directory.clearances
            WHERE email = lower($1) AND now() >= valid_from AND now() < valid_until
          )
          SELECT
            coalesce((SELECT string_agg(policy || ':' || classification, ',') FROM valid), '') AS classifications,
            coalesce((SELECT string_agg(valid.policy || ':' || category, ',') FROM valid, unnest(valid.categories) AS category), '') AS categories
        input_mapping:
          - jwt_claim: email
            parameter: email
            required: true
        output_mapping:
          - source_column: classifications
            claim_name: classifications
            transformation: csv_to_array
          - source_column: categories
            claim_name: categories
            transformation: csv_to_array
  kas:
    # The KAS keys live in the platform's key registry, their private halves
    # wrapped with the root key; the provisioning job creates the hybrid key
    # and makes it the base key, whose KAS address new envelopes name.
    key_management: true
    root_key: placeholder
    registered_kas_uri: https://placeholder.invalid/kas
    preview:
      # Required to unwrap hybrid-wrapped key access objects
      # (hpqt:secp384r1-mlkem1024).
      hybrid_tdf_enabled: true

server:
  port: 8080
  auth:
    enabled: true
    issuer: https://placeholder.invalid/
    audience: placeholder
    dpop:
      enforce: false
    cache_refresh_interval: 15m
    skew: 1m
    policy:
      # Version 2 also names the client a token was issued to, so that the
      # provisioning job's client credentials can be granted a role.
      version: v2
      username_claim: preferred_username
      groups_claim: groups
      # LemonLDAP::NG access tokens carry client_id, not azp.
      client_id_claim: client_id
      # Appended to the built-in policy. The group names are those registered
      # at the corporate SSO. dcs-provisioner is only allowed the client
      # credentials grant: no person can hold its tokens. The built-in policy
      # also gives roles to the groups opentdf-admin and opentdf-standard,
      # which the deny lines take back: only this stack's groups get a role.
      extension: |
        g, role:dcs-maquette-admin, role:admin
        g, role:dcs-maquette, role:standard
        g, client:dcs-provisioner, role:admin
        p, role:opentdf-admin, *, *, deny
        p, role:opentdf-standard, *, *, deny
  cors:
    enabled: true
    allowedorigins:
      - https://placeholder.invalid
    additionalheaders:
      - Connect-Timeout-Ms
      - X-User-Agent
  grpc:
    reflectionEnabled: false
  cryptoProvider:
    type: standard
